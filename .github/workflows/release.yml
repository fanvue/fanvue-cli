name: Release

# release-please keeps a release PR open; merging it tags a version and runs the jobs below.
#
# npm publishes through trusted publishing (OIDC): each @fanvue/cli* package on npmjs.com names this repo and
# release.yml as its trusted publisher, so the publish job needs no npm token.
#
# Secrets for signing and notarising the macOS binaries. Without APPLE_CERT_P12_BASE64 the release ships them
# unsigned:
#   APPLE_CERT_P12_BASE64         Developer ID Application certificate, .p12, base64
#   APPLE_CERT_PASSWORD           its export password
#   APPLE_TEAM_ID                 the Apple developer team ID
#   APPLE_API_KEY_ID              App Store Connect API key for notarisation
#   APPLE_API_ISSUER_ID
#   APPLE_API_KEY_P8              the .p8 key contents

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check:public
      # Bun cross-compiles every target from one runner.
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/public/

  sign-macos:
    needs: build
    runs-on: macos-latest
    env:
      SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/public/
      - name: Note unsigned macOS binaries
        if: env.SIGNING != 'true'
        run: echo "::warning::APPLE_CERT_P12_BASE64 is not set; the macOS binaries ship unsigned."
      - name: Import the Developer ID certificate
        if: env.SIGNING == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Sign and notarise
        if: env.SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY_P8" > key.p8
          for bin in dist/public/fanvue-darwin-arm64 dist/public/fanvue-darwin-x64; do
            codesign --force --timestamp --options runtime \
              --entitlements npm/entitlements.plist \
              --identifier com.fanvue.cli \
              --sign "Developer ID Application" "$bin"
            codesign --verify --strict "$bin"
            ditto -c -k "$bin" "$bin.zip"
            # A bare binary can't be stapled; Gatekeeper checks the notarisation online.
            xcrun notarytool submit "$bin.zip" --wait \
              --key key.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --team-id "$TEAM_ID"
            rm "$bin.zip"
          done
          rm key.p8
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-signed
          path: dist/public/

  publish:
    needs: [release-please, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: binaries-signed
          path: dist/public/
      - run: bun install --frozen-lockfile
      - run: bun run package
      # npm, not `bun publish`, for this one step: only npm can attach provenance.
      # Platform packages first, so the launcher never points at a version that isn't there.
      - name: Publish to npm
        run: |
          for dir in dist/npm/cli-*; do npm publish "$dir" --access public --provenance; done
          npm publish dist/npm/cli --access public --provenance
      - name: Attach the binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/public/*
